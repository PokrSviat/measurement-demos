[project]
name = "llm-results-memo"
version = "0.1.0"
description = "LLM-drafted marketing summary of a geo-test result, accepted only when every number and the decision match the source JSON."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sviatoslav Pokrovskii" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
results-memo = "results_memo.run:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
