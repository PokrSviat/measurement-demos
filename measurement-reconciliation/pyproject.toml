[project]
name = "measurement-reconciliation"
version = "0.1.0"
description = "Reconcile a geo experiment, a Bayesian MMM, and a Markov model on one synthetic dataset."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sviatoslav Pokrovskii" }]
dependencies = ["budget-rule", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
